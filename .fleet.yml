schema: 1
visibility: "public"
license: "agpl"
params:
  codecov: true
  conclusion:
    workflow: ".github/workflows/ci.yml"
    audit-jobs: ["pinprick"]
    pinprick-jobs: ["pinprick"]
  astro-docs: true
  dependabot:
    - package-ecosystem: "github-actions"
      group: "github-actions"
      directory: "/"
      ignore:
        - dependency-name: "actions/setup-node"
          reason: "pinprick's source scan does not yet cover setup-node v7; reassess when it does"
          versions: [">=7.0.0"]
    - package-ecosystem: "npm"
      group: "npm-dependencies"
      directory: "/site"
      ignore:
        - dependency-name: "typescript"
          reason: "TypeScript 7.0 lacks Astro's required API; reassess with 7.1: https://github.com/withastro/astro/issues/17268"
          versions: [">=7.0.0 <7.1.0"]
    - package-ecosystem: "swift"
      group: "swift-dependencies"
      directory: "/"
  npm-policy:
    strict-allow-scripts: true
    projects: ["site"]
  link-check:
    targets: >-
      --config lychee.toml --root-dir site/dist/client
      --remap "^https://macosdb[.]com/404/$ file://${GITHUB_WORKSPACE}/site/dist/client/404.html"
      --remap "^https://macosdb[.]com/ file://${GITHUB_WORKSPACE}/site/dist/client/"
      './site/dist/client/**/*.html' README.md SECURITY.md CONTRIBUTING.md './docs/**/*.md'
    build-site: true
    site-directory: "site"
    authenticated-github: false
    schedule: "0 14 * * 1"
    concurrency-group: "link-check"
  codeql:
    languages: ["swift"]
    paths: ["Sources/**", "Package.swift", "Package.resolved"]
    runner: "macos-26"
    timeout-minutes: 30
    build-mode: "manual"
    build-profile: "swift-package"
  pinprick-audit:
    advanced-security: "${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}"
    fail-on-findings: true
    pull-request: true
    accept-action-findings:
      - action: "Homebrew/actions/setup-homebrew"
        path: "setup-homebrew/main.sh"
        category: "shell_fetch"
        severity: "high"
        description: "shell executing fetched content via command substitution — bypasses pinning"
        command: 'NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"'
        reason: "setup-homebrew installs Homebrew from Homebrew/install HEAD when a runner lacks it, which Homebrew keeps deliberately rather than pinning each installer change"
    accept-workflow-findings:
      - workflow: ".github/workflows/scan-ipsw.yml"
        workflow-sha256: "d278845586154400235fe0af0f789905b4d06cbb53e95d6b4c902ef5f5439d52"
        category: "shell_fetch"
        severity: "low"
        description: "curl/wget downloads executable from non-literal source — cannot verify URL version"
        command: "curl -fsSL --proto '=https' --proto-redir '=https'  --retry 10 --retry-delay 10 --retry-connrefused --retry-all-errors -C - -o \"${IPSW_FILE}.part\" \"${IPSW_URL}\" &"
        reason: "Repository maintainer accepts this runtime-selected Apple archive download for static scanning. Preserve validated Apple URLs, per-release resumable paths, TLS restrictions, archive validation, and no execution of extracted binaries. Cache checksums are not independent publisher authentication. Reviewed 2026-10-06: candidate adds a read-only pending-publication gate and refreshes the trusted base; archive download and execution behavior is unchanged; renew only after workflow review. See docs/operations.md#accepted-archive-download-risk."
      - workflow: ".github/workflows/scan-xip.yml"
        workflow-sha256: "83d194c3ca24b3e518e1e53313d77e08b83c8f0caa028a8cc53d0b8193f35d12"
        category: "shell_fetch"
        severity: "low"
        description: "curl/wget downloads executable from non-literal source — cannot verify URL version"
        command: "curl -sS --fail --proto '=https' --max-redirs 0  --retry 10 --retry-delay 10 --retry-connrefused --retry-all-errors -C - -H \"Cookie: ADCDownloadAuth=${ADC_DOWNLOAD_AUTH}\" -o \"${XIP_FILE}.part\" \"${CDN_URL}\" &"
        reason: "Repository maintainer accepts this runtime-selected Apple archive download for static scanning. Preserve validated Apple URLs, per-release resumable paths, TLS restrictions, archive validation, and no execution of extracted binaries. Cache checksums are not independent publisher authentication. Reviewed 2026-10-06: candidate adds a read-only pending-publication gate and refreshes the trusted base; archive download and execution behavior is unchanged; renew only after workflow review. See docs/operations.md#accepted-archive-download-risk."
  readme:
    badges:
      workflow: "ci.yml"
      extra:
        - "[![Data: CC-BY-4.0](https://img.shields.io/badge/Data-CC--BY--4.0-green.svg)](data/LICENSE)"
    license:
      text: |-
        This project is licensed under the [GNU Affero General Public License v3.0](LICENSE) (`AGPL-3.0-only`).

        The release data in `data/` is licensed separately under [CC-BY-4.0](data/LICENSE).

        Copyright (C) 2026 Patrick Linnane
exceptions: {}
