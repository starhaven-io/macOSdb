# The scanner workflows' accepted pinprick findings bind their exact bytes, so
# they set up Ruby through this action to keep setup-ruby updates out of them.
name: Set up Ruby
description: Install the Ruby in .ruby-version without Bundler.
runs:
  using: composite
  steps:
    - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
      with:
        bundler: none
