name: Release

on:
  workflow_dispatch:

defaults:
  run:
    # No -x: this workflow handles signing/notarization secrets, generated
    # keychain passwords, and short-lived app tokens.
    shell: bash -euo pipefail {0}

concurrency:
  group: release
  cancel-in-progress: false
  queue: max

permissions: {}

env:
  DEVELOPMENT_TEAM: ${{ vars.DEVELOPMENT_TEAM }}

jobs:
  validate-dispatch:
    name: Validate dispatch
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions: {}
    steps:
      - name: Require main branch
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::Release workflow must be dispatched from main, got ${REF_NAME}."
            exit 1
          fi

  build:
    name: Build
    needs: validate-dispatch
    runs-on: macos-26
    timeout-minutes: 60
    environment:
      name: release
      deployment: false
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact: ${{ steps.package.outputs.artifact }}
    permissions:
      contents: read
      attestations: write # required to generate build provenance attestations
      id-token: write # required to generate build provenance attestations
    env:
      TEMPORARY_KEYCHAIN_FILE: "macosdb_signing.keychain-db"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep -m1 'static let current' Sources/macosdb/Version.swift | sed -E 's/.*"([^"]+)".*/\1/')
          if [[ -z "${VERSION}" ]]; then
            echo "::error::Could not extract version from Sources/macosdb/Version.swift"
            exit 1
          fi
          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release version '${VERSION}' is not a canonical semantic version."
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Build release binary
        run: |
          swift build -c release --arch arm64 --product macosdb
          echo "BINARY=$(swift build -c release --arch arm64 --show-bin-path)/macosdb" >> "${GITHUB_ENV}"

      - name: Create signing keychain and import certificate
        env:
          DEVELOPER_ID_CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          set +x
          if [[ -z "${DEVELOPMENT_TEAM}" ]]; then
            echo "::error::DEVELOPMENT_TEAM repository variable is not configured."
            exit 1
          fi
          TEMPORARY_KEYCHAIN_PASSWORD="$(openssl rand -base64 20)"
          echo "::add-mask::${TEMPORARY_KEYCHAIN_PASSWORD}"
          TEMPORARY_KEYCHAIN_PATH="${RUNNER_TEMP}/${TEMPORARY_KEYCHAIN_FILE}"
          security create-keychain -p "${TEMPORARY_KEYCHAIN_PASSWORD}" "${TEMPORARY_KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${TEMPORARY_KEYCHAIN_PATH}"
          security unlock-keychain -p "${TEMPORARY_KEYCHAIN_PASSWORD}" "${TEMPORARY_KEYCHAIN_PATH}"
          echo -n "${DEVELOPER_ID_CERTIFICATE}" | base64 --decode --output="${RUNNER_TEMP}/certificate.p12"
          security import "${RUNNER_TEMP}/certificate.p12" \
            -k "${RUNNER_TEMP}/${TEMPORARY_KEYCHAIN_FILE}" \
            -P "${DEVELOPER_ID_CERTIFICATE_PASSWORD}" \
            -t cert -f pkcs12 \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "${TEMPORARY_KEYCHAIN_PASSWORD}" \
            "${TEMPORARY_KEYCHAIN_PATH}"
          rm -f "${RUNNER_TEMP}/certificate.p12"
          security list-keychain -d user -s "${RUNNER_TEMP}/${TEMPORARY_KEYCHAIN_FILE}"

      - name: Codesign binary
        run: |
          codesign --sign "Developer ID Application: Patrick Linnane (${DEVELOPMENT_TEAM})" \
            --options runtime \
            "${BINARY}"
          codesign --verify --strict --verbose=2 "${BINARY}"

      - name: Notarize binary
        env:
          APPLE_ID: ${{ secrets.NOTARIZATION_APPLE_ID }}
          NOTARIZATION_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
        run: |
          set +x  # keep the notarization password out of the xtrace log
          mkdir -p "${RUNNER_TEMP}/notarize-staging"
          cp "${BINARY}" "${RUNNER_TEMP}/notarize-staging/"
          ditto -c -k "${RUNNER_TEMP}/notarize-staging" "${RUNNER_TEMP}/macosdb-notarize.zip"
          xcrun notarytool submit "${RUNNER_TEMP}/macosdb-notarize.zip" \
            --apple-id "${APPLE_ID}" \
            --team-id "${DEVELOPMENT_TEAM}" \
            --password "${NOTARIZATION_PASSWORD}" \
            --wait
          for attempt in 1 2 3; do
            if codesign --verify --strict -R='notarized' --check-notarization --verbose=4 "${BINARY}"; then
              break
            else
              status=$?
            fi
            if (( status != 3 || attempt == 3 )); then
              echo "::error::Notarization requirement verification failed after ${attempt} attempt(s)."
              exit "${status}"
            fi
            echo "::warning::Notarization ticket verification failed; retrying in 10 seconds (${attempt}/3)."
            sleep 10
          done

      - name: Clean up temporary keychain
        if: always()
        run: |
          if [[ -f "${RUNNER_TEMP}/${TEMPORARY_KEYCHAIN_FILE}" ]]; then
            security delete-keychain "${RUNNER_TEMP}/${TEMPORARY_KEYCHAIN_FILE}"
          fi
          rm -f "${RUNNER_TEMP}/certificate.p12" "${RUNNER_TEMP}/macosdb-notarize.zip"
          if [[ -d "${RUNNER_TEMP}/notarize-staging" ]]; then
            rm -rf "${RUNNER_TEMP}/notarize-staging"
          fi

      - name: Package
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ARTIFACT="macosdb-${VERSION}-aarch64-apple-darwin"
          mkdir -p staging
          cp "${BINARY}" staging/macosdb
          cp LICENSE staging/
          /usr/bin/tar --no-mac-metadata --no-xattrs -czf "${ARTIFACT}.tar.gz" -C staging .
          shasum -a 256 "${ARTIFACT}.tar.gz" > "${ARTIFACT}.tar.gz.sha256"
          echo "artifact=${ARTIFACT}" >> "${GITHUB_OUTPUT}"

      - name: Generate build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "${{ steps.package.outputs.artifact }}.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: |
            ${{ steps.package.outputs.artifact }}.tar.gz
            ${{ steps.package.outputs.artifact }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Release
    needs: build
    runs-on: ubuntu-slim
    timeout-minutes: 60
    environment:
      name: release
      deployment: false
    permissions:
      attestations: read # required to verify build provenance on resumptions
      contents: read # required to check out and verify the release source
    outputs:
      version: ${{ needs.build.outputs.version }}
    env:
      TAG: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: artifacts

      - name: Verify release assets
        env:
          ARTIFACT: ${{ needs.build.outputs.artifact }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          test -s "artifacts/${ARTIFACT}.tar.gz"
          test -s "artifacts/${ARTIFACT}.tar.gz.sha256"
          (cd artifacts && shasum -a 256 -c "${ARTIFACT}.tar.gz.sha256")
          /usr/bin/tar -tzf "artifacts/${ARTIFACT}.tar.gz" >/dev/null
          gh attestation verify "artifacts/${ARTIFACT}.tar.gz" \
            --repo "${REPOSITORY}" \
            --signer-workflow "${REPOSITORY}/.github/workflows/release.yml" \
            --source-digest "${GITHUB_SHA}" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners

      - name: Mint release token
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Create or verify tag
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if EXISTING_SHA=$(gh api "repos/${REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.sha' 2>/dev/null); then
            if [[ "${EXISTING_SHA}" != "${COMMIT_SHA}" ]]; then
              echo "::error::Immutable tag ${TAG} points to ${EXISTING_SHA}, expected ${COMMIT_SHA}."
              exit 1
            fi
            echo "Tag ${TAG} already points to the expected commit; resuming release."
          else
            gh api "repos/${REPOSITORY}/git/refs" \
              -f "ref=refs/tags/${TAG}" \
              -f "sha=${COMMIT_SHA}"
          fi

      - name: Create or resume release
        id: create-release
        env:
          ATTESTATION_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          ARTIFACT: ${{ needs.build.outputs.artifact }}
        run: |
          if gh release view "${TAG}" --repo "${REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; verifying its assets."
            mapfile -t ASSET_NAMES < <(
              gh release view "${TAG}" --repo "${REPOSITORY}" --json assets --jq '.assets[].name'
            )
            ARCHIVE_PRESENT=false
            CHECKSUM_PRESENT=false
            for asset in "${ASSET_NAMES[@]}"; do
              [[ "${asset}" == "${ARTIFACT}.tar.gz" ]] && ARCHIVE_PRESENT=true
              [[ "${asset}" == "${ARTIFACT}.tar.gz.sha256" ]] && CHECKSUM_PRESENT=true
            done

            if [[ "${ARCHIVE_PRESENT}" != "${CHECKSUM_PRESENT}" ]]; then
              echo "::error::Release ${TAG} contains only one member of the archive/checksum pair."
              exit 1
            fi
            if [[ "${ARCHIVE_PRESENT}" == false ]]; then
              gh release upload "${TAG}" \
                "artifacts/${ARTIFACT}.tar.gz" \
                "artifacts/${ARTIFACT}.tar.gz.sha256" \
                --repo "${REPOSITORY}"
            fi

            REMOTE_ASSETS="${RUNNER_TEMP}/remote-release-assets"
            mkdir -p "${REMOTE_ASSETS}"
            # A tag can be moved but an asset id cannot, so fetch each asset by id and
            # bind the bytes to the digest the API reports before trusting them.
            RELEASE_ASSETS=$(gh api "repos/${REPOSITORY}/releases/tags/${TAG}" --jq '.assets')
            for name in "${ARTIFACT}.tar.gz" "${ARTIFACT}.tar.gz.sha256"; do
              ASSET_ID=$(jq -r --arg name "${name}" '.[] | select(.name == $name) | .id' <<< "${RELEASE_ASSETS}")
              ASSET_DIGEST=$(jq -r --arg name "${name}" '.[] | select(.name == $name) | .digest // empty' <<< "${RELEASE_ASSETS}")
              if [[ ! "${ASSET_ID}" =~ ^[0-9]+$ || ! "${ASSET_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                echo "::error::Release asset ${name} does not have exactly one id with a SHA-256 digest."
                exit 1
              fi
              gh api -H "Accept: application/octet-stream" "repos/${REPOSITORY}/releases/assets/${ASSET_ID}" > "${REMOTE_ASSETS}/${name}"
              echo "${ASSET_DIGEST#sha256:}  ${REMOTE_ASSETS}/${name}" | sha256sum --check
            done
            (cd "${REMOTE_ASSETS}" && shasum -a 256 -c "${ARTIFACT}.tar.gz.sha256")
            GH_TOKEN="${ATTESTATION_TOKEN}" gh attestation verify "${REMOTE_ASSETS}/${ARTIFACT}.tar.gz" \
              --repo "${REPOSITORY}" \
              --signer-workflow "${REPOSITORY}/.github/workflows/release.yml" \
              --source-digest "${GITHUB_SHA}" \
              --source-ref refs/heads/main \
              --deny-self-hosted-runners
          else
            NOTES_START=$(gh release list \
              --repo "${REPOSITORY}" \
              --limit 100 \
              --json tagName,isDraft,publishedAt \
              --jq 'map(select(.isDraft | not)) | sort_by(.publishedAt) | last | .tagName // empty')

            create_args=("${TAG}" --repo "${REPOSITORY}" --title "${TAG}" --generate-notes)
            if [[ -n "${NOTES_START}" ]]; then
              create_args+=(--notes-start-tag "${NOTES_START}")
              echo "Generating notes since last published release: ${NOTES_START}"
            else
              echo "No prior published release; generating notes from the repository start"
            fi
            gh release create "${create_args[@]}" \
              "artifacts/${ARTIFACT}.tar.gz" \
              "artifacts/${ARTIFACT}.tar.gz.sha256"
          fi

          gh release view "${TAG}" \
            --repo "${REPOSITORY}" \
            --json body \
            --jq '.body' > "${RUNNER_TEMP}/raw_notes.md"
          if grep -Fqx "## macOSdb ${TAG}" "${RUNNER_TEMP}/raw_notes.md"; then
            echo "needs_format=false" >> "${GITHUB_OUTPUT}"
          else
            echo "needs_format=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Format release notes
        if: steps.create-release.outputs.needs_format == 'true'
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/format-release-notes.py \
            "${RUNNER_TEMP}/raw_notes.md" "${TAG}" \
            > "${RUNNER_TEMP}/formatted_notes.md"
          gh release edit "${TAG}" \
            --repo "${REPOSITORY}" \
            --notes-file "${RUNNER_TEMP}/formatted_notes.md"

  bump-cask:
    name: Bump Homebrew cask
    needs: release
    runs-on: macos-26
    timeout-minutes: 60
    environment:
      name: release
      deployment: false
    permissions: {}
    outputs:
      base_branch: ${{ steps.cask-bump.outputs.base_branch }}
      base_sha: ${{ steps.cask-bump.outputs.base_sha }}
      bot_user: ${{ steps.cask-bump.outputs.bot_user }}
      branch: ${{ steps.cask-bump.outputs.branch }}
      head_sha: ${{ steps.cask-bump.outputs.head_sha }}
      pr_number: ${{ steps.cask-bump.outputs.pr_number }}
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@3cdb78d0f62ad29dd32de765782654f4eedea607 # 2026.08.31.1
        with:
          stable: true

      - name: Mint bot token for tap
        id: tap-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-tap
          permission-contents: write
          permission-pull-requests: write

      - name: Bump Homebrew cask
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
          HOMEBREW_GITHUB_API_TOKEN: ${{ steps.tap-token.outputs.token }}
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_ENV_HINTS: 1
          APP_SLUG: ${{ steps.tap-token.outputs.app-slug }}
        run: |
          BOT_USER="${APP_SLUG}[bot]"
          BOT_ID=$(gh api "/users/${BOT_USER}" --jq .id)
          export HOMEBREW_GIT_NAME="${BOT_USER}"
          export HOMEBREW_GIT_EMAIL="${BOT_ID}+${BOT_USER}@users.noreply.github.com"
          brew tap starhaven-io/tap
          brew trust starhaven-io/tap
          # Homebrew supplies the subject; prepare its DCO trailer before commit-msg validation.
          TAP_ROOT="$(cd "$(brew --repo starhaven-io/tap)" && pwd -P)"
          HOOKS_DIR=$(git -C "${TAP_ROOT}" rev-parse --path-format=absolute --git-path hooks)
          HOOKS_DIR=$(python3 -c 'import pathlib, sys; print(pathlib.Path(sys.argv[1]).resolve())' "${HOOKS_DIR}")
          case "${HOOKS_DIR}" in
            "${TAP_ROOT}/"*) ;;
            *) echo "::error::Tap hooks directory is outside the fresh checkout."; exit 1 ;;
          esac
          mkdir -p "${HOOKS_DIR}"
          DCO_DIR=$(mktemp -d "${RUNNER_TEMP}/cask-dco.XXXXXX")
          DCO_HOOK="${DCO_DIR}/prepare-commit-msg"
          PREPARE_HOOK="${HOOKS_DIR}/prepare-commit-msg"
          cleanup_dco_hook() {
            if [[ -L "${PREPARE_HOOK}" ]] && [[ "$(readlink "${PREPARE_HOOK}")" == "${DCO_HOOK}" ]]; then
              rm -- "${PREPARE_HOOK}"
            fi
            rm -rf -- "${DCO_DIR}"
          }
          trap cleanup_dco_hook EXIT
          cat > "${DCO_HOOK}" <<'HOOK'
          #!/bin/sh
          set -eu
          author=$(git var GIT_AUTHOR_IDENT)
          author="${author%> *}>"
          git interpret-trailers --in-place --where end --if-exists addIfDifferent --if-missing add \
            --trailer "Signed-off-by: ${author}" "$1"
          HOOK
          chmod +x "${DCO_HOOK}"
          if ! python3 -c 'import os, sys; os.symlink(sys.argv[1], sys.argv[2])' "${DCO_HOOK}" "${PREPARE_HOOK}"; then
            echo "::error::Cannot install the DCO hook; an existing prepare-commit-msg hook must be preserved."
            exit 1
          fi
          brew bump-cask-pr --no-fork --version "${VERSION}" starhaven-io/tap/macosdb

      - name: Resolve Homebrew cask bump
        id: cask-bump
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
          APP_SLUG: ${{ steps.tap-token.outputs.app-slug }}
          CASK: macosdb
        run: |
          BOT_USER="${APP_SLUG}[bot]"
          BRANCH_VERSION="${VERSION//,/-}"
          BRANCH_VERSION="${BRANCH_VERSION//:/-}"
          BRANCH="bump-${CASK}-${BRANCH_VERSION}"
          PRS=$(gh pr list \
            --repo starhaven-io/homebrew-tap \
            --head "${BRANCH}" \
            --state open \
            --json number,headRepositoryOwner)
          MATCH_COUNT=$(jq '[.[] | select(.headRepositoryOwner.login == "starhaven-io")] | length' \
            <<< "${PRS}")
          if [[ "${MATCH_COUNT}" != 1 ]]; then
            echo "::error::expected one open Homebrew cask bump PR for ${BRANCH}, found ${MATCH_COUNT}"
            exit 1
          fi
          PR_NUMBER=$(jq -r '.[] | select(.headRepositoryOwner.login == "starhaven-io") | .number' \
            <<< "${PRS}")
          PR_JSON=$(gh api "/repos/starhaven-io/homebrew-tap/pulls/${PR_NUMBER}")
          jq -e \
            --arg bot "${BOT_USER}" \
            --arg branch "${BRANCH}" \
            '.state == "open"
              and .user.login == $bot
              and .head.ref == $branch
              and .head.repo.full_name == "starhaven-io/homebrew-tap"
              and .changed_files == 1' <<< "${PR_JSON}" >/dev/null
          {
            echo "base_branch=$(jq -r '.base.ref' <<< "${PR_JSON}")"
            echo "base_sha=$(jq -r '.base.sha' <<< "${PR_JSON}")"
            echo "bot_user=${BOT_USER}"
            echo "branch=${BRANCH}"
            echo "head_sha=$(jq -r '.head.sha' <<< "${PR_JSON}")"
            echo "pr_number=${PR_NUMBER}"
          } >> "${GITHUB_OUTPUT}"

  merge-cask-bump:
    name: Merge validated Homebrew cask bump
    needs: bump-cask
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: release
      deployment: false
    permissions:
      contents: read
    steps:
      - name: Wait for checks on the validated head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.bump-cask.outputs.pr_number }}
          HEAD_SHA: ${{ needs.bump-cask.outputs.head_sha }}
        run: |
          test "$(gh api "/repos/starhaven-io/homebrew-tap/pulls/${PR_NUMBER}" --jq .head.sha)" = "${HEAD_SHA}"
          CHECK_TIMEOUT_SECONDS=1500
          CHECK_INTERVAL_SECONDS=10
          DEADLINE=$((SECONDS + CHECK_TIMEOUT_SECONDS))
          REQUIRED_CHECKS=0
          for attempt in {1..30}; do
            REQUIRED_CHECKS=$(gh pr checks "${PR_NUMBER}" \
              --repo starhaven-io/homebrew-tap --required --json name --jq length 2>/dev/null || true)
            if [[ "${REQUIRED_CHECKS}" =~ ^[1-9][0-9]*$ ]]; then
              break
            fi
            if [[ "${attempt}" == 30 ]]; then
              echo "::error::no required checks appeared before the cask check timeout"
              exit 1
            fi
            sleep "${CHECK_INTERVAL_SECONDS}"
          done
          CHECKS_READY=false
          MERGE_STATE=UNKNOWN
          while (( SECONDS < DEADLINE )); do
            CHECK_STATUS=0
            gh pr checks "${PR_NUMBER}" --repo starhaven-io/homebrew-tap --required \
              || CHECK_STATUS=$?
            case "${CHECK_STATUS}" in
              0) CHECK_SUMMARY=passing ;;
              8) CHECK_SUMMARY=pending ;;
              *)
                echo "::error::a required cask check failed"
                exit "${CHECK_STATUS}"
                ;;
            esac
            PR_STATE=$(gh pr view "${PR_NUMBER}" --repo starhaven-io/homebrew-tap \
              --json headRefOid,mergeStateStatus)
            if ! jq -e --arg head "${HEAD_SHA}" \
              '.headRefOid == $head' <<< "${PR_STATE}" >/dev/null; then
              echo "::error::cask pull request head changed while waiting for required checks"
              exit 1
            fi
            MERGE_STATE=$(jq -r '.mergeStateStatus' <<< "${PR_STATE}")
            echo "Required cask checks: ${CHECK_SUMMARY}; merge state: ${MERGE_STATE}"
            if (( CHECK_STATUS == 0 )) \
              && [[ "${MERGE_STATE}" == "CLEAN" || "${MERGE_STATE}" == "UNSTABLE" ]]; then
              CHECKS_READY=true
              break
            fi
            sleep "${CHECK_INTERVAL_SECONDS}"
          done
          if [[ "${CHECKS_READY}" != true ]]; then
            echo "::error::required cask checks did not satisfy branch policy before the timeout (merge state: ${MERGE_STATE})"
            exit 1
          fi

      - name: Mint bot token for tap
        id: tap-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-tap
          permission-contents: write
          permission-pull-requests: write

      - name: Revalidate and merge the exact head
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
          PR_NUMBER: ${{ needs.bump-cask.outputs.pr_number }}
          BOT_USER: ${{ needs.bump-cask.outputs.bot_user }}
          BRANCH: ${{ needs.bump-cask.outputs.branch }}
          BASE_BRANCH: ${{ needs.bump-cask.outputs.base_branch }}
          BASE_SHA: ${{ needs.bump-cask.outputs.base_sha }}
          HEAD_SHA: ${{ needs.bump-cask.outputs.head_sha }}
          CASK_PATH: Casks/macosdb.rb
        run: |
          PR_JSON=$(gh api "/repos/starhaven-io/homebrew-tap/pulls/${PR_NUMBER}")
          jq -e \
            --arg bot "${BOT_USER}" \
            --arg branch "${BRANCH}" \
            --arg base "${BASE_BRANCH}" \
            --arg base_sha "${BASE_SHA}" \
            --arg head "${HEAD_SHA}" \
            '.state == "open"
              and .user.login == $bot
              and .head.ref == $branch
              and .head.repo.full_name == "starhaven-io/homebrew-tap"
              and .head.sha == $head
              and .base.ref == $base
              and .base.sha == $base_sha
              and .changed_files == 1' <<< "${PR_JSON}" >/dev/null
          FILES_JSON=$(gh api "/repos/starhaven-io/homebrew-tap/pulls/${PR_NUMBER}/files")
          jq -e --arg cask "${CASK_PATH}" \
            'length == 1 and .[0].filename == $cask and .[0].status == "modified"' \
            <<< "${FILES_JSON}" >/dev/null
          gh pr merge "${PR_NUMBER}" --repo starhaven-io/homebrew-tap --squash \
            --match-head-commit "${HEAD_SHA}"
