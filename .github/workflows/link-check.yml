name: Link Check

on:
  schedule:
    - cron: "0 14 * * 1" # every Monday at 14:00 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: "link-check"
  cancel-in-progress: true

jobs:
  lychee:
    name: Check links
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-link-check.yml@3febdd066c19c823fb376c21563a6634294df72d # v2026.10.08.4
    with:
      args: "--config lychee.toml --root-dir site/dist/client --remap \"^https://macosdb[.]com/404/$ file://${GITHUB_WORKSPACE}/site/dist/client/404.html\" --remap \"^https://macosdb[.]com/ file://${GITHUB_WORKSPACE}/site/dist/client/\" './site/dist/client/**/*.html' README.md SECURITY.md CONTRIBUTING.md './docs/**/*.md'"
      build-site: true
      site-directory: "site"
      authenticated-github: false
