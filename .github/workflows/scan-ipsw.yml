name: Scan IPSW

# The dispatching client locates its run by this id in the run-name;
# removing the marker forces it back to a fragile createdAt guess.
run-name: "Scan IPSW${{ inputs.dispatch_id && format(' [{0}]', inputs.dispatch_id) || '' }}"

on:
  workflow_dispatch:
    inputs:
      ipsw_url:
        description: "IPSW download URL"
        required: true
        type: string
      release_date:
        description: "Release date (ISO 8601, e.g. 2025-04-02). Defaults to today."
        required: false
        type: string
      beta:
        description: "Is this a beta release?"
        required: false
        type: boolean
        default: false
      beta_number:
        description: "Beta number (e.g. 3)"
        required: false
        type: string
      beta_revision:
        description: "Replacement beta revision (e.g. 2 for beta 3 v.2)"
        required: false
        type: string
      rc:
        description: "Is this a Release Candidate?"
        required: false
        type: boolean
        default: false
      rc_number:
        description: "RC number (e.g. 2). Omit for just RC"
        required: false
        type: string
      device_specific:
        description: "Device-specific build (e.g. M3 launch build)"
        required: false
        type: boolean
        default: false
      dispatch_id:
        description: "Opaque token echoed into run-name so the dispatching client can match this run. Set automatically on dispatch; leave blank for manual runs."
        required: false
        type: string

defaults:
  run:
    shell: bash -euo pipefail {0}

concurrency:
  group: scan
  cancel-in-progress: false

permissions: {}

jobs:
  prepare:
    name: Establish trusted inputs
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      base_sha: ${{ steps.inputs.outputs.base_sha }}
      release_date: ${{ steps.inputs.outputs.release_date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Resolve trusted base and release date
        id: inputs
        env:
          INPUT_DATE: ${{ inputs.release_date }}
        run: |
          RELEASE_DATE="${INPUT_DATE:-$(TZ='America/Los_Angeles' date +%Y-%m-%d)}"
          if ! [[ "${RELEASE_DATE}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] \
            || [[ "$(date -u -d "${RELEASE_DATE}" +%Y-%m-%d 2>/dev/null || true)" != "${RELEASE_DATE}" ]]; then
            echo "::error::release_date '${RELEASE_DATE}' is not a real ISO 8601 calendar date."
            exit 1
          fi
          TODAY=$(TZ='America/Los_Angeles' date +%Y-%m-%d)
          if [[ "${RELEASE_DATE}" > "${TODAY}" ]]; then
            echo "::error::release_date '${RELEASE_DATE}' is in the future (today is ${TODAY} Pacific)."
            exit 1
          fi
          echo "base_sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          echo "release_date=${RELEASE_DATE}" >> "${GITHUB_OUTPUT}"

  scan:
    name: Scan
    needs: prepare
    runs-on: scanner
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Add Homebrew to PATH
        run: echo "/opt/homebrew/bin" >> "${GITHUB_PATH}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Clean workspace
        run: git clean -fdx data/macos/releases/

      - name: Resolve release date
        env:
          TRUSTED_DATE: ${{ needs.prepare.outputs.release_date }}
        run: |
          echo "RELEASE_DATE=${TRUSTED_DATE}" >> "${GITHUB_ENV}"

      - name: Resolve IPSW path
        id: resolve-ipsw
        env:
          IPSW_URL: ${{ inputs.ipsw_url }}
        run: |
          if [[ "${IPSW_URL}" == *$'\n'* || "${IPSW_URL}" == *$'\r'* ]]; then
            echo "::error::Refusing an IPSW URL containing control characters."
            exit 1
          fi
          if [[ ! "${IPSW_URL}" =~ ^https://updates\.cdn-apple\.com/.+\.ipsw([?#].*)?$ ]]; then
            echo "::error::Refusing IPSW URL '${IPSW_URL}': expected an https://updates.cdn-apple.com/... .ipsw URL."
            exit 1
          fi
          ORIG_NAME=$(basename "${IPSW_URL%%\?*}")
          if [[ ! "${ORIG_NAME}" =~ ^UniversalMac_[0-9]+(\.[0-9]+){1,2}_[0-9]+[A-Z][0-9]+[a-z]?_Restore\.ipsw$ ]]; then
            echo "::error::Refusing IPSW filename '${ORIG_NAME}': expected UniversalMac_<version>_<build>_Restore.ipsw."
            exit 1
          fi
          VERSION=$(echo "${ORIG_NAME}" | sed -E 's/UniversalMac_([0-9.]+)_.*/\1/')
          BUILD=$(echo "${ORIG_NAME}" | sed -E 's/UniversalMac_[0-9.]+_([^_]+)_.*/\1/')
          MAJOR=${VERSION%%.*}
          # Route to the archive drive whose version range covers this major.
          # Drives mount at /Volumes/macOS-Archive-<range>: "LO-HI" (sealed) or
          # "LO+" (active). No hardcoded boundary, so adding or sealing a drive
          # needs no workflow edit.
          ARCHIVE_ROOT=""
          seen=()
          for vol in /Volumes/macOS-Archive-*; do
            [[ -d "${vol}" ]] || continue
            seen+=("${vol##*/}")
            suffix=${vol##*/macOS-Archive-}
            if [[ "${suffix}" =~ ^([0-9]+)\+$ ]]; then
              lo=${BASH_REMATCH[1]}; hi=999999
            elif [[ "${suffix}" =~ ^([0-9]+)-([0-9]+)$ ]]; then
              lo=${BASH_REMATCH[1]}; hi=${BASH_REMATCH[2]}
            else
              continue
            fi
            if (( MAJOR >= lo && MAJOR <= hi )); then
              if [[ -n "${ARCHIVE_ROOT}" ]]; then
                echo "::error::macOS ${MAJOR} matches multiple archive drives (${ARCHIVE_ROOT}, ${vol})."
                exit 1
              fi
              ARCHIVE_ROOT="${vol}"
            fi
          done
          if [[ -z "${ARCHIVE_ROOT}" ]]; then
            echo "::error::No mounted archive drive covers macOS ${MAJOR}. Mounted: ${seen[*]:-none}."
            exit 1
          fi
          IPSW_DIR="${ARCHIVE_ROOT}/macOS/${MAJOR}"
          mkdir -p "${IPSW_DIR}"
          IPSW_DIR=$(cd "${IPSW_DIR}" && pwd -P)
          IPSW_FILE="${IPSW_DIR}/macOS-${VERSION}-${BUILD}.ipsw"
          if [[ "${IPSW_FILE}" != "${IPSW_DIR}/"* ]]; then
            echo "::error::Resolved IPSW path escaped its archive directory."
            exit 1
          fi
          {
            printf 'IPSW_FILE=%s\n' "${IPSW_FILE}"
            printf 'EXPECTED_VERSION=%s\n' "${VERSION}"
            printf 'EXPECTED_BUILD=%s\n' "${BUILD}"
          } >> "${GITHUB_ENV}"
          echo "source_url=${IPSW_URL}" >> "${GITHUB_OUTPUT}"

      - name: Restore CLI build cache
        id: cache-cli
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/release/macosdb
          key: macosdb-cli-${{ hashFiles('Sources/**/*.swift', 'Package.swift', 'Package.resolved') }}

      - name: Build CLI
        if: steps.cache-cli.outputs.cache-hit != 'true'
        run: swift build -c release --product macosdb

      - name: Save CLI build cache
        if: steps.cache-cli.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/release/macosdb
          key: macosdb-cli-${{ hashFiles('Sources/**/*.swift', 'Package.swift', 'Package.resolved') }}

      - name: Download IPSW
        env:
          IPSW_URL: ${{ inputs.ipsw_url }}
        run: |
          if [[ -L "${IPSW_FILE}" || -L "${IPSW_FILE}.part" \
            || -L "${IPSW_FILE}.sha256" || -L "${IPSW_FILE}.pem" ]]; then
            echo "::error::Refusing a symbolic link at the resolved IPSW path."
            exit 1
          fi
          if [[ -e "${IPSW_FILE}" && ! -f "${IPSW_FILE}" ]]; then
            echo "::error::Refusing a non-regular file at the resolved IPSW path."
            exit 1
          fi
          if [[ -f "${IPSW_FILE}" ]]; then
            if [[ -f "${IPSW_FILE}.sha256" ]]; then
              .build/release/macosdb validate "${IPSW_FILE}"
            fi
            echo "IPSW already cached at ${IPSW_FILE}, skipping download"
          else
            TOTAL=$(curl -fsSLI --proto '=https' --proto-redir '=https' \
              --connect-timeout 30 --max-time 60 --retry 5 --retry-connrefused \
              "${IPSW_URL}" | grep -i content-length | tail -1 | tr -dc '0-9' || true)
            if [[ -n "${TOTAL}" ]] && (( TOTAL > 0 )); then
              TOTAL_MB=$(( TOTAL / 1048576 ))
              TOTAL_GB=$(( TOTAL_MB * 10 / 1024 ))
              echo "Downloading IPSW ($(( TOTAL_GB / 10 )).$(( TOTAL_GB % 10 )) GB)..."
            else
              TOTAL_MB=0
              echo "Downloading IPSW (unknown size)..."
            fi
            curl -fsSL --proto '=https' --proto-redir '=https' \
              --retry 10 --retry-delay 10 --retry-connrefused --retry-all-errors \
              -C - -o "${IPSW_FILE}.part" "${IPSW_URL}" &
            CURL_PID=$!
            while kill -0 "${CURL_PID}" 2>/dev/null; do
              if [[ -f "${IPSW_FILE}.part" ]]; then
                SIZE=$(stat -f%z "${IPSW_FILE}.part" 2>/dev/null || echo 0)
                SIZE_MB=$(( SIZE / 1048576 ))
                if (( TOTAL_MB > 0 )); then
                  PCT=$(( SIZE_MB * 100 / TOTAL_MB ))
                  echo "${PCT}% (${SIZE_MB} MB / ${TOTAL_MB} MB)"
                else
                  echo "${SIZE_MB} MB downloaded"
                fi
              fi
              sleep 30
            done
            wait "${CURL_PID}"
            mv "${IPSW_FILE}.part" "${IPSW_FILE}"
          fi

      - name: Validate IPSW
        run: |
          FILE_SIZE=$(stat -f%z "${IPSW_FILE}")
          FILE_TYPE=$(file -b "${IPSW_FILE}")
          if (( FILE_SIZE < 104857600 )) || [[ "${FILE_TYPE}" != *"Zip archive"* ]]; then
            echo "::error::Downloaded file is not a valid IPSW (${FILE_TYPE}, $(( FILE_SIZE / 1024 )) KB)."
            exit 1
          fi
          echo "IPSW validated: $(( FILE_SIZE / 1073741824 )) GB, ${FILE_TYPE}"

      - name: Set or verify IPSW modification time
        run: |
          if [[ "$(stat -f '%Sf' "${IPSW_FILE}")" == *uchg* ]]; then
            ARCHIVE_DATE=$(stat -f '%Sm' -t '%Y-%m-%d' "${IPSW_FILE}")
            if [[ "${ARCHIVE_DATE}" != "${RELEASE_DATE}" ]]; then
              echo "::error::Cached IPSW is immutable with modification date ${ARCHIVE_DATE}; expected ${RELEASE_DATE}. Re-dispatch with release_date=${ARCHIVE_DATE}, or unlock and correct the archive if that date is wrong."
              exit 1
            fi
            echo "IPSW already immutable with release-date mtime ${ARCHIVE_DATE}, leaving unchanged"
          else
            TOUCH_DATE=$(echo "${RELEASE_DATE}" | tr -d '-')0000
            touch -t "${TOUCH_DATE}" "${IPSW_FILE}"
          fi

      - name: Scan IPSW
        env:
          IPSW_URL: ${{ inputs.ipsw_url }}
          IS_BETA: ${{ inputs.beta }}
          BETA_NUMBER: ${{ inputs.beta_number }}
          BETA_REVISION: ${{ inputs.beta_revision }}
          IS_RC: ${{ inputs.rc }}
          RC_NUMBER: ${{ inputs.rc_number }}
          IS_DEVICE_SPECIFIC: ${{ inputs.device_specific }}
        run: |
          SCAN_ARGS=(
            "${IPSW_FILE}"
            --output data/macos/releases
            --release-date "${RELEASE_DATE}"
            --update-index
            --verbose
            --save-aea-key
            --ipsw-url "${IPSW_URL}"
          )
          if [[ "${IS_BETA}" == "true" ]]; then
            SCAN_ARGS+=(--beta)
          fi
          if [[ -n "${BETA_NUMBER}" ]]; then
            SCAN_ARGS+=(--beta-number "${BETA_NUMBER}")
          fi
          if [[ -n "${BETA_REVISION}" ]]; then
            SCAN_ARGS+=(--beta-revision "${BETA_REVISION}")
          fi
          if [[ "${IS_RC}" == "true" ]]; then
            SCAN_ARGS+=(--rc)
          fi
          if [[ -n "${RC_NUMBER}" ]]; then
            SCAN_ARGS+=(--rc-number "${RC_NUMBER}")
          fi
          if [[ "${IS_DEVICE_SPECIFIC}" == "true" ]]; then
            SCAN_ARGS+=(--device-specific)
          fi
          .build/release/macosdb scan "${SCAN_ARGS[@]}"

      - name: Lint JSON
        run: python3 scripts/lint-json.py

      - name: Generate SHA-256 sidecar
        run: .build/release/macosdb validate "${IPSW_FILE}"

      - name: Lock archive files
        run: |
          if [[ "$(stat -f '%Sf' "${IPSW_FILE}.sha256")" == *uchg* ]]; then
            echo "SHA-256 sidecar already immutable, preserving its mtime"
          else
            touch -r "${IPSW_FILE}" "${IPSW_FILE}.sha256"
          fi
          for f in "${IPSW_FILE}" "${IPSW_FILE}.pem" "${IPSW_FILE}.sha256"; do
            [[ -f "$f" ]] && chflags uchg "$f"
          done

      - name: Package release JSON
        id: package-release
        run: |
          NEW_RELEASE_FILE=""
          MATCHES=0
          while IFS= read -r file; do
            [[ -n "${file}" ]] || continue
            NEW_RELEASE_FILE="${file}"
            MATCHES=$((MATCHES + 1))
          done < <(git ls-files --others --exclude-standard 'data/macos/releases/')

          if (( MATCHES != 1 )); then
            echo "::error::Expected exactly one new macOS release JSON file, found ${MATCHES}."
            exit 1
          fi
          EXPECTED_RELEASE_FILE="data/macos/releases/${EXPECTED_VERSION%%.*}/macOS-${EXPECTED_VERSION}-${EXPECTED_BUILD}.json"
          if [[ "${NEW_RELEASE_FILE}" != "${EXPECTED_RELEASE_FILE}" ]]; then
            echo "::error::Unexpected release JSON path: ${NEW_RELEASE_FILE}"
            exit 1
          fi
          if ! jq -e --arg version "${EXPECTED_VERSION}" --arg build "${EXPECTED_BUILD}" \
            '.osVersion == $version and .buildNumber == $build and .productType == "macOS"' \
            "${NEW_RELEASE_FILE}" >/dev/null; then
            echo "::error::Scanned macOS metadata does not match the source version/build."
            exit 1
          fi

          /usr/bin/tar --no-mac-metadata --no-xattrs -czf "${RUNNER_TEMP}/release-json.tgz" data/macos/releases.json "${NEW_RELEASE_FILE}"
          echo "basename=$(basename "${NEW_RELEASE_FILE}" .json)" >> "${GITHUB_OUTPUT}"

      - name: Upload release JSON artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-json
          path: ${{ runner.temp }}/release-json.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish
    needs: [prepare, scan]
    runs-on: ubuntu-slim
    timeout-minutes: 60
    environment:
      name: starhaven
      deployment: false
    outputs:
      pr_number: ${{ steps.open-pr.outputs.pr_number }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Download release JSON artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-json
          path: ${{ runner.temp }}/artifact

      - name: Verify and overlay release JSON
        id: verify-release
        env:
          ARTIFACT: ${{ runner.temp }}/artifact/release-json.tgz
          SOURCE_URL: ${{ inputs.ipsw_url }}
          RELEASE_DATE: ${{ needs.prepare.outputs.release_date }}
          IS_BETA: ${{ inputs.beta }}
          BETA_NUMBER: ${{ inputs.beta_number }}
          BETA_REVISION: ${{ inputs.beta_revision }}
          IS_RC: ${{ inputs.rc }}
          RC_NUMBER: ${{ inputs.rc_number }}
          IS_DEVICE_SPECIFIC: ${{ inputs.device_specific }}
        run: |
          python3 scripts/verify-release-artifact.py \
            --artifact "${ARTIFACT}" \
            --product macos \
            --source-url "${SOURCE_URL}" \
            --release-date "${RELEASE_DATE}" \
            --beta "${IS_BETA}" \
            --beta-number "${BETA_NUMBER}" \
            --beta-revision "${BETA_REVISION}" \
            --rc "${IS_RC}" \
            --rc-number "${RC_NUMBER}" \
            --device-specific "${IS_DEVICE_SPECIFIC}" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Lint JSON
        run: python3 scripts/lint-json.py

      - name: Mint bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create signed commit and open PR
        id: open-pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_URL: ${{ steps.verify-release.outputs.source_url }}
          RELEASE_DATE: ${{ steps.verify-release.outputs.release_date }}
          BASENAME: ${{ steps.verify-release.outputs.basename }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          BASE_SHA=$(git rev-parse HEAD)
          BOT_USER="${APP_SLUG}[bot]"
          BOT_ID=$(gh api "/users/${BOT_USER}" --jq .id)

          BRANCH="feat/data-${BASENAME}"
          TITLE="feat(data): add ${BASENAME}"
          printf -v PR_BODY "## Summary\n- Scanned from IPSW: \`%s\`\n- Release date: %s\n\nAuto-generated by the [scan workflow](%s)." \
            "${SOURCE_URL}" "${RELEASE_DATE}" "${RUN_URL}"
          COMMIT_BODY="Signed-off-by: ${BOT_USER} <${BOT_ID}+${BOT_USER}@users.noreply.github.com>"

          if [[ -n "${TRIGGERING_ACTOR}" ]]; then
            if [[ ! "${TRIGGERING_ACTOR}" =~ ^[A-Za-z0-9][A-Za-z0-9-]{0,38}$ ]]; then
              echo "::error::Invalid triggering actor login."
              exit 1
            fi
            ACTOR_ID=$(gh api "/users/${TRIGGERING_ACTOR}" --jq .id)
            COAUTHOR="Co-authored-by: ${TRIGGERING_ACTOR} <${ACTOR_ID}+${TRIGGERING_ACTOR}@users.noreply.github.com>"
            COMMIT_BODY="${COMMIT_BODY}"$'\n'"${COAUTHOR}"
          fi

          # Stage untracked files as intent-to-add so git diff sees them.
          git add -N data/macos/
          DIFF_FILES=$(git diff --name-only HEAD -- data/macos/)
          if [[ -z "${DIFF_FILES}" ]]; then
            echo "::error::No macOS data changes found after overlaying scan artifact."
            exit 1
          fi
          ADDITIONS_FILE="${RUNNER_TEMP}/additions.json"
          # shellcheck disable=SC2094 # Output is under RUNNER_TEMP, outside data/.
          printf '%s\n' "${DIFF_FILES}" |
            while IFS= read -r file; do
              # shellcheck disable=SC2016 # jq needs literal jq variable names.
              base64 < "$file" | tr -d '\n' |
                jq -Rs --arg path "$file" '{path: $path, contents: .}'
            done | jq -s . > "${ADDITIONS_FILE}"

          gh api "repos/${REPOSITORY}/git/refs" -X POST \
            -f "ref=refs/heads/${BRANCH}" \
            -f "sha=${BASE_SHA}"

          REQUEST_FILE="${RUNNER_TEMP}/create-commit.json"
          # shellcheck disable=SC2016 # jq needs literal GraphQL variable names.
          jq -n \
            --arg repo "${REPOSITORY}" \
            --arg branch "${BRANCH}" \
            --arg title "${TITLE}" \
            --arg body "${COMMIT_BODY}" \
            --arg head "${BASE_SHA}" \
            --slurpfile additions "${ADDITIONS_FILE}" \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid url } } }",
              variables: {
                input: {
                  branch: { repositoryNameWithOwner: $repo, branchName: $branch },
                  message: { headline: $title, body: $body },
                  fileChanges: { additions: $additions[0] },
                  expectedHeadOid: $head
                }
              }
            }' > "${REQUEST_FILE}"
          gh api graphql --input "${REQUEST_FILE}"

          PR_URL=$(gh pr create \
            --base main \
            --head "${BRANCH}" \
            --title "${TITLE}" \
            --body "${PR_BODY}")
          PR_NUMBER="${PR_URL##*/}"
          if [[ ! "${PR_NUMBER}" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not parse pull request number from gh output: ${PR_URL}"
            exit 1
          fi
          echo "pr_number=${PR_NUMBER}" >> "${GITHUB_OUTPUT}"

          gh pr merge "${BRANCH}" --squash --auto --delete-branch --body "${COMMIT_BODY}"

  wait-for-merge:
    name: Wait for merge
    needs: publish
    runs-on: ubuntu-slim
    timeout-minutes: 30
    permissions:
      pull-requests: read # required to poll auto-merge status without the app token
    steps:
      - name: Wait for PR to merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.publish.outputs.pr_number }}
        run: |
          if [[ ! "${PR_NUMBER}" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid pull request number: ${PR_NUMBER}"
            exit 1
          fi
          echo "Waiting for PR #${PR_NUMBER} to merge..."
          while true; do
            STATE=$(gh pr view "${PR_NUMBER}" --repo "${REPOSITORY}" --json state -q .state 2>/dev/null || true)
            case "${STATE}" in
              MERGED) echo "PR merged successfully"; exit 0 ;;
              CLOSED) echo "::error::PR was closed without merging"; exit 1 ;;
            esac
            sleep 30
          done
