name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - main

defaults:
  run:
    shell: bash -xeuo pipefail {0}

concurrency:
  # PR body/title edits fire `edited` events; give them their own per-run group so
  # they can't cancel in-flight tests from the preceding `opened`/`synchronize` run.
  group: ${{ github.event.action == 'edited' && format('ci-edit-{0}-{1}', github.ref, github.run_id) || format('ci-{0}', github.ref) }}
  cancel-in-progress: true

permissions: {}

jobs:
  generate-matrix:
    name: Generate matrix
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      run_codeql: ${{ steps.matrix.outputs.run_codeql }}
      run_codeql_interpreted: ${{ steps.matrix.outputs.run_codeql_interpreted }}
      run_zizmor: ${{ steps.matrix.outputs.run_zizmor }}
      run_links: ${{ steps.matrix.outputs.run_links }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate CI matrix
        id: matrix
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Push to main: run test-tsan so Codecov has a baseline for PR
          # coverage comparisons.
          if [[ "${EVENT_NAME}" == "push" ]]; then
            {
              echo 'matrix=[{"name":"Test (Thread Sanitizer)","check":"test-tsan","runner":"macos-26","sanitize":"thread","coverage":"true","environment":"codecov"}]'
              echo "run_codeql=false"
              echo "run_codeql_interpreted=false"
              echo "run_zizmor=false"
              echo "run_links=false"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          MATRIX='[]'
          RUN_CODEQL=false
          RUN_CODEQL_INTERPRETED=false
          RUN_ZIZMOR=false
          RUN_LINKS=false
          add_check() {
            local entry="$1"
            if [[ "${MATRIX}" == "[]" ]]; then
              MATRIX="[${entry}]"
            else
              MATRIX="${MATRIX%]},${entry}]"
            fi
          }

          # `edited` (title/body/base) also runs the full path-derived matrix. The
          # aggregate "conclusion" job is the only required status check, so it must
          # certify every relevant leg for the current commit. Collapsing to a
          # commits-only matrix on `edited` lets a green run overwrite a prior failing
          # one on the same SHA, bypassing tests, lint-json, CodeQL and the rest.
          CHANGED_PATHS_FILE="${RUNNER_TEMP}/changed-paths.z"
          git diff --name-only -z "${BASE_SHA}...HEAD" > "${CHANGED_PATHS_FILE}"
          mapfile -d '' -t CHANGED < "${CHANGED_PATHS_FILE}"
          matches_changed_path() {
            local pattern="$1"
            local changed_path
            for changed_path in "${CHANGED[@]}"; do
              if [[ "${changed_path}" =~ ${pattern} ]]; then
                return 0
              fi
            done
            return 1
          }

          # Swift, CI workflow, or project tooling changes: lint + sanitizer tests.
          # Tooling paths (scripts/, justfile, hooks, lint configs) are included so a
          # PR touching only those can't merge having run nothing but the commits leg.
          if matches_changed_path '\.swift$|^Package\.(swift|resolved)$|^\.swiftlint\.yml$|^\.github/|^scripts/|^Tests/macOSdbCoreTests/Fixtures/ordering-vectors\.json$|^justfile$|^\.githooks/|^_typos\.toml$|^lychee\.toml$|^README\.md$|^SECURITY\.md$|^CONTRIBUTING\.md$|^docs/|^LICENSE$'; then
            add_check '{"name":"Lint","check":"lint","runner":"macos-26"}'
            add_check '{"name":"Test (Thread Sanitizer)","check":"test-tsan","runner":"macos-26","sanitize":"thread","coverage":"true","environment":"codecov"}'
            add_check '{"name":"Test (Address Sanitizer)","check":"test-asan","runner":"macos-26","sanitize":"address"}'
          fi

          # Source changes: CodeQL
          if matches_changed_path '^Sources/|^Package\.(swift|resolved)$'; then
            RUN_CODEQL=true
          fi

          # Site and repository-script changes: interpreted-language CodeQL.
          if matches_changed_path '^site/|^scripts/'; then
            RUN_CODEQL_INTERPRETED=true
          fi

          # Data changes — and changes to the linter that gates them — run lint-json
          # so a modified scripts/lint-json.py is re-validated against existing data.
          if matches_changed_path '^data/|^scripts/'; then
            add_check '{"name":"Lint JSON","check":"lint-json","runner":"ubuntu-slim"}'
          fi

          # Workflow changes run the script contracts that enforce release and
          # scanner invariants, not only the Actions syntax/security audits.
          if matches_changed_path '^\.github/workflows/|^scripts/|^Sources/macOSdbCore/Scanner/(ScannerConfig|XcodeScanner)\.swift$|^Tests/macOSdbCoreTests/Fixtures/ordering-vectors\.json$'; then
            add_check '{"name":"Script Tests","check":"script-tests","runner":"ubuntu-slim"}'
          fi

          # Site or data changes: format check + build
          if matches_changed_path '^site/|^data/|^Tests/macOSdbCoreTests/Fixtures/ordering-vectors\.json$'; then
            add_check '{"name":"Site","check":"site","runner":"ubuntu-slim"}'
          fi

          # Workflow changes: Actions security audit
          if matches_changed_path '^\.github/workflows/'; then
            RUN_ZIZMOR=true
          fi

          if matches_changed_path '^site/|^data/|^README\.md$|^SECURITY\.md$|^CONTRIBUTING\.md$|^docs/|^LICENSE$|^lychee\.toml$'; then
            RUN_LINKS=true
          fi

          {
            echo "matrix=${MATRIX}"
            echo "run_codeql=${RUN_CODEQL}"
            echo "run_codeql_interpreted=${RUN_CODEQL_INTERPRETED}"
            echo "run_zizmor=${RUN_ZIZMOR}"
            echo "run_links=${RUN_LINKS}"
          } >> "${GITHUB_OUTPUT}"

  commits:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read # required to read PR titles
    uses: starhaven-io/.github/.github/workflows/reusable-conventional-commits.yml@a2332e3f09757e3a96fdb76b0492a129f0c1a613 # v2026.09.06.5

  check:
    name: ${{ matrix.name }}
    needs: generate-matrix
    if: ${{ needs.generate-matrix.outputs.matrix != '[]' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    environment:
      name: ${{ matrix.environment }}
      deployment: false
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ matrix.fetch_depth || 1 }}
          persist-credentials: false


      - name: Install lint tools
        if: matrix.check == 'lint'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_ENV_HINTS: 1
        run: brew install actionlint swiftlint typos-cli

      - name: Actionlint
        if: matrix.check == 'lint'
        run: actionlint -no-color

      - name: SwiftLint
        if: matrix.check == 'lint'
        run: swiftlint --strict --no-cache

      - name: Typos
        if: matrix.check == 'lint'
        run: typos


      - name: Lint JSON
        if: matrix.check == 'lint-json'
        run: python3 scripts/lint-json.py

      - name: Script tests
        if: matrix.check == 'script-tests'
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Setup Node
        if: matrix.check == 'site'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26

      - name: Check npm install-script policy
        if: matrix.check == 'site'
        run: node scripts/check-npm-install-policy.mjs site

      - name: Install site dependencies
        if: matrix.check == 'site'
        working-directory: site
        # Fail if an unreviewed dependency install script is introduced.
        run: npm ci --strict-allow-scripts

      - name: Check formatting
        if: matrix.check == 'site'
        working-directory: site
        run: npm run format:check

      - name: Site tests
        if: matrix.check == 'site'
        working-directory: site
        run: npm test

      - name: Type-check site
        if: matrix.check == 'site'
        working-directory: site
        run: npm run check

      - name: Audit site dependencies
        if: matrix.check == 'site'
        working-directory: site
        run: npm run audit

      - name: Build site
        if: matrix.check == 'site'
        working-directory: site
        run: npm run build

      - name: Deploy dry-run
        if: matrix.check == 'site'
        working-directory: site
        run: npm run deploy:dry
        env:
          WRANGLER_SEND_METRICS: "false"


      - name: Test
        if: startsWith(matrix.check, 'test-')
        env:
          SANITIZE: ${{ matrix.sanitize }}
          COVERAGE: ${{ matrix.coverage }}
        run: |
          swift test --sanitize "${SANITIZE}" ${COVERAGE:+--enable-code-coverage}

      - name: Export LCOV for Codecov
        if: success() && matrix.check == 'test-tsan'
        run: |
          BIN_PATH=$(swift build --show-bin-path)
          PROFDATA="${BIN_PATH}/codecov/default.profdata"
          if [[ ! -f "${PROFDATA}" ]]; then
            echo "::error::No coverage profdata at ${PROFDATA}"
            exit 1
          fi
          BINARY_ARGS=()
          FIRST=""
          while IFS= read -r xctest; do
            name=$(basename "${xctest}" .xctest)
            bin="${xctest}/Contents/MacOS/${name}"
            [[ -f "${bin}" ]] || continue
            if [[ -z "${FIRST}" ]]; then FIRST="${bin}"; else BINARY_ARGS+=(-object "${bin}"); fi
          done < <(find "${BIN_PATH}" -name '*.xctest' -type d)
          if [[ -z "${FIRST}" ]]; then
            echo "::error::No xctest binaries found under ${BIN_PATH}"
            exit 1
          fi
          xcrun llvm-cov export -format=lcov \
            -ignore-filename-regex='(Tests/|\.build/|/Checkouts/|/SourcePackages/)' \
            "${FIRST}" \
            ${BINARY_ARGS[@]+"${BINARY_ARGS[@]}"} \
            -instr-profile="${PROFDATA}" \
            > coverage.lcov
          echo "lcov: $(wc -l < coverage.lcov) lines"

      - name: Upload coverage to Codecov
        if: success() && matrix.check == 'test-tsan'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.lcov
          fail_ci_if_error: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]' }}


  codeql:
    name: CodeQL
    needs: generate-matrix
    if: needs.generate-matrix.outputs.run_codeql == 'true'
    permissions:
      contents: read
      security-events: write # required to upload SARIF results
    uses: starhaven-io/.github/.github/workflows/reusable-codeql.yml@a2332e3f09757e3a96fdb76b0492a129f0c1a613 # v2026.09.06.5
    with:
      languages: '["swift"]'
      runner: "macos-26"
      timeout-minutes: 30
      build-mode: "manual"
      build-profile: "swift-package"

  codeql-interpreted:
    name: CodeQL (site and scripts)
    needs: generate-matrix
    if: needs.generate-matrix.outputs.run_codeql_interpreted == 'true'
    permissions:
      contents: read
      security-events: write # required to upload SARIF results
    uses: starhaven-io/.github/.github/workflows/reusable-codeql.yml@a2332e3f09757e3a96fdb76b0492a129f0c1a613 # v2026.09.06.5
    with:
      languages: '["javascript-typescript","python"]'
      runner: "ubuntu-slim"

  zizmor:
    name: zizmor
    needs: generate-matrix
    if: needs.generate-matrix.outputs.run_zizmor == 'true'
    permissions:
      contents: read
      security-events: write # required for zizmor SARIF upload
    uses: starhaven-io/.github/.github/workflows/reusable-zizmor.yml@a2332e3f09757e3a96fdb76b0492a129f0c1a613 # v2026.09.06.5

  links:
    name: Check links
    needs: generate-matrix
    if: needs.generate-matrix.outputs.run_links == 'true'
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-link-check.yml@a2332e3f09757e3a96fdb76b0492a129f0c1a613 # v2026.09.06.5
    with:
      args: "--config lychee.toml --root-dir site/dist/client './site/dist/client/**/*.html' README.md SECURITY.md CONTRIBUTING.md './docs/**/*.md'"
      build-site: true
      site-directory: "site"
      authenticated-github: false

  conclusion:
    name: conclusion
    needs: [generate-matrix, commits, check, codeql, codeql-interpreted, zizmor, links]
    runs-on: ubuntu-slim
    timeout-minutes: 15
    if: always()
    steps:
      - name: Result
        env:
          GENERATE_MATRIX_RESULT: ${{ needs.generate-matrix.result }}
          COMMITS_RESULT: ${{ needs.commits.result }}
          CHECK_RESULT: ${{ needs.check.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          CODEQL_INTERPRETED_RESULT: ${{ needs.codeql-interpreted.result }}
          ZIZMOR_RESULT: ${{ needs.zizmor.result }}
          LINKS_RESULT: ${{ needs.links.result }}
        run: |
          test "${GENERATE_MATRIX_RESULT}" = "success"
          test "${COMMITS_RESULT}" = "success" || test "${COMMITS_RESULT}" = "skipped"
          test "${CHECK_RESULT}" = "success" || test "${CHECK_RESULT}" = "skipped"
          test "${CODEQL_RESULT}" = "success" || test "${CODEQL_RESULT}" = "skipped"
          test "${CODEQL_INTERPRETED_RESULT}" = "success" || test "${CODEQL_INTERPRETED_RESULT}" = "skipped"
          test "${ZIZMOR_RESULT}" = "success" || test "${ZIZMOR_RESULT}" = "skipped"
          test "${LINKS_RESULT}" = "success" || test "${LINKS_RESULT}" = "skipped"
