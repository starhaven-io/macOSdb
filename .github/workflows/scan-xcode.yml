name: Scan Xcode

on:
  workflow_dispatch:
    inputs:
      archive_url:
        description: "Xcode archive download URL (.xip or .aea)"
        required: true
        type: string
      build_number:
        description: "Build number (e.g. 17E5170d)"
        required: true
        type: string
      release_date:
        description: "Release date (ISO 8601, e.g. 2025-04-02). Defaults to today."
        required: false
        type: string
      beta:
        description: "Is this a beta release?"
        required: false
        type: boolean
        default: false
      beta_number:
        description: "Beta number (e.g. 3)"
        required: false
        type: string
      beta_revision:
        description: "Replacement beta revision (e.g. 2 for beta 3 v.2)"
        required: false
        type: string
      rc:
        description: "Is this a Release Candidate?"
        required: false
        type: boolean
        default: false
      rc_number:
        description: "RC number (e.g. 2). Omit for just RC"
        required: false
        type: string

defaults:
  run:
    shell: bash -euo pipefail {0}

concurrency:
  group: scan
  cancel-in-progress: false
  queue: max

permissions: {}

jobs:
  prepare:
    name: Establish trusted inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # Check for an earlier open catalog publication.
    outputs:
      base_sha: ${{ steps.inputs.outputs.base_sha }}
      release_date: ${{ steps.inputs.outputs.release_date }}
    steps:
      - name: Require main branch
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::Scanner workflows must be dispatched from main."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up Ruby
        uses: $/.github/actions/setup-ruby

      - name: Require previous catalog publication to finish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ruby scripts/check-catalog-publication.rb --repository "${GITHUB_REPOSITORY}"
          # A previous PR may have merged after checkout but before the query.
          git fetch --no-tags origin main
          git checkout --detach FETCH_HEAD

      - name: Resolve trusted base and release date
        id: inputs
        env:
          INPUT_DATE: ${{ inputs.release_date }}
        run: |
          RELEASE_DATE="${INPUT_DATE:-$(TZ='America/Los_Angeles' date +%Y-%m-%d)}"
          if ! [[ "${RELEASE_DATE}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] \
            || [[ "$(date -u -d "${RELEASE_DATE}" +%Y-%m-%d 2>/dev/null || true)" != "${RELEASE_DATE}" ]]; then
            echo "::error::release_date '${RELEASE_DATE}' is not a real ISO 8601 calendar date."
            exit 1
          fi
          TODAY=$(TZ='America/Los_Angeles' date +%Y-%m-%d)
          if [[ "${RELEASE_DATE}" > "${TODAY}" ]]; then
            echo "::error::release_date '${RELEASE_DATE}' is in the future (today is ${TODAY} Pacific)."
            exit 1
          fi
          echo "base_sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          echo "release_date=${RELEASE_DATE}" >> "${GITHUB_OUTPUT}"

  scan:
    name: Scan
    needs: prepare
    runs-on: scanner
    timeout-minutes: 180
    # A job's whole secret context reaches its runner, so this self-hosted job
    # binds only the environment holding the download cookie, never the
    # publishing credentials in starhaven.
    environment:
      name: apple-developer
      deployment: false
    permissions:
      contents: read
    steps:
      - name: Add Homebrew to PATH
        run: |
          echo "/opt/homebrew/bin" >> "${GITHUB_PATH}"
          echo "/opt/homebrew/opt/ruby/bin" >> "${GITHUB_PATH}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify scanner Ruby
        run: ruby scripts/check-ruby.rb

      - name: Clean workspace
        run: git clean -fdx data/xcode/releases/

      - name: Resolve release date
        env:
          TRUSTED_DATE: ${{ needs.prepare.outputs.release_date }}
        run: |
          echo "RELEASE_DATE=${TRUSTED_DATE}" >> "${GITHUB_ENV}"

      - name: Resolve archive path
        id: resolve-archive
        env:
          ARCHIVE_URL: ${{ inputs.archive_url }}
          BUILD: ${{ inputs.build_number }}
        run: |
          DOWNLOAD_PATH=$(echo "${ARCHIVE_URL}" | sed -E 's/.*[?&]path=([^&]*).*/\1/')
          # The ADCDownloadAuth secret cookie is sent to adcdownload.apple.com${DOWNLOAD_PATH}.
          # Reject anything that isn't a clean absolute .xip or .aea path so a value like
          # "@evil.example.com/x.xip" can't redirect curl (and the cookie) to another host.
          if [[ ! "${DOWNLOAD_PATH}" =~ ^/[A-Za-z0-9._~%/+-]+\.(xip|aea)$ ]]; then
            echo "::error::Refusing to use the supplied download path: not a clean absolute .xip or .aea path."
            exit 1
          fi
          LOWER_DOWNLOAD_PATH=$(printf '%s' "${DOWNLOAD_PATH}" | tr '[:upper:]' '[:lower:]')
          if [[ "${DOWNLOAD_PATH}" == *'//'* ]] \
            || [[ "${DOWNLOAD_PATH}" =~ (^|/)\.{1,2}(/|$) ]] \
            || [[ "${LOWER_DOWNLOAD_PATH}" =~ %(00|0a|0d|2f|5c) ]]; then
            echo "::error::Refusing a download path containing ambiguous or encoded separators."
            exit 1
          fi
          ORIG_NAME=$(basename "${DOWNLOAD_PATH}")
          if [[ ! "${ORIG_NAME}" =~ ^Xcode_[0-9]+(\.[0-9]+)*(_[A-Za-z0-9._~%+-]+)?\.(xip|aea)$ ]]; then
            echo "::error::Refusing Xcode filename '${ORIG_NAME}': expected Xcode_<version>[_<qualifier>].xip or .aea."
            exit 1
          fi
          # The cached archive keeps the download's format: the scanner records
          # the source pair of the archive it reads, not of the URL it is given.
          ARCHIVE_FORMAT="${ORIG_NAME##*.}"
          VERSION=$(echo "${ORIG_NAME}" | sed -E 's/Xcode_([0-9]+(\.[0-9]+)*).*/\1/')
          if [[ "${VERSION}" != *.* ]]; then
            VERSION="${VERSION}.0"
          fi
          MAJOR=${VERSION%%.*}
          if ! /bin/bash scripts/validate-xcode-build.sh "${BUILD}"; then
            echo "::error::build_number is not an Apple build number."
            exit 1
          fi
          # Route to the archive drive whose version range covers this major.
          # Drives mount at /Volumes/macOS-Archive-<range>: "LO-HI" (sealed) or
          # "LO+" (active). No hardcoded boundary, so adding or sealing a drive
          # needs no workflow edit.
          ARCHIVE_ROOT=""
          seen=()
          for vol in /Volumes/macOS-Archive-*; do
            [[ -d "${vol}" ]] || continue
            seen+=("${vol##*/}")
            suffix=${vol##*/macOS-Archive-}
            if [[ "${suffix}" =~ ^([0-9]+)\+$ ]]; then
              lo=${BASH_REMATCH[1]}; hi=999999
            elif [[ "${suffix}" =~ ^([0-9]+)-([0-9]+)$ ]]; then
              lo=${BASH_REMATCH[1]}; hi=${BASH_REMATCH[2]}
            else
              continue
            fi
            if (( MAJOR >= lo && MAJOR <= hi )); then
              if [[ -n "${ARCHIVE_ROOT}" ]]; then
                echo "::error::Xcode ${MAJOR} matches multiple archive drives (${ARCHIVE_ROOT}, ${vol})."
                exit 1
              fi
              ARCHIVE_ROOT="${vol}"
            fi
          done
          if [[ -z "${ARCHIVE_ROOT}" ]]; then
            echo "::error::No mounted archive drive covers Xcode ${MAJOR}. Mounted: ${seen[*]:-none}."
            exit 1
          fi
          ARCHIVE_DIR="${ARCHIVE_ROOT}/Xcode/${MAJOR}"
          mkdir -p "${ARCHIVE_DIR}"
          ARCHIVE_DIR=$(cd "${ARCHIVE_DIR}" && pwd -P)
          ARCHIVE_FILE="${ARCHIVE_DIR}/Xcode-${VERSION}-${BUILD}.${ARCHIVE_FORMAT}"
          if [[ "${ARCHIVE_FILE}" != "${ARCHIVE_DIR}/"* ]]; then
            echo "::error::Resolved archive path escaped its archive directory."
            exit 1
          fi
          # adcdownload.apple.com is the CDN the ADCDownloadAuth cookie is
          # scoped to; the services-account URL is the auth-aware portal
          # link (what developer.apple.com hands out), which is what we
          # want surfaced in release JSON so visitors get logged in cleanly
          # rather than bouncing off the CDN's unauthorized page.
          CDN_URL="https://adcdownload.apple.com${DOWNLOAD_PATH}"
          PUBLIC_URL="https://developer.apple.com/services-account/download?path=${DOWNLOAD_PATH}"
          {
            printf 'ARCHIVE_FILE=%s\n' "${ARCHIVE_FILE}"
            printf 'ARCHIVE_FORMAT=%s\n' "${ARCHIVE_FORMAT}"
            printf 'CDN_URL=%s\n' "${CDN_URL}"
            printf 'PUBLIC_URL=%s\n' "${PUBLIC_URL}"
            printf 'EXPECTED_VERSION=%s\n' "${VERSION}"
            printf 'EXPECTED_BUILD=%s\n' "${BUILD}"
          } >> "${GITHUB_ENV}"
          echo "source_url=${PUBLIC_URL}" >> "${GITHUB_OUTPUT}"

      - name: Identify Swift build environment
        id: swift-build-environment
        run: |
          SWIFT_VERSION=$(swift --version)
          SDK_BUILD=$(xcrun --sdk macosx --show-sdk-build-version)
          SDK_PATH=$(xcrun --sdk macosx --show-sdk-path)
          BUILD_IDENTITY=$(printf '%s\n' "${SWIFT_VERSION}" "${SDK_BUILD}" "${SDK_PATH}" | shasum -a 256)
          echo "digest=${BUILD_IDENTITY%% *}" >> "${GITHUB_OUTPUT}"

      - name: Restore CLI build cache
        id: cache-cli
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/release/macosdb
          key: macosdb-cli-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift-build-environment.outputs.digest }}-${{ hashFiles('Sources/**/*.swift', 'Package.swift', 'Package.resolved') }}

      - name: Build CLI
        if: steps.cache-cli.outputs.cache-hit != 'true'
        run: swift build -c release --product macosdb

      - name: Save CLI build cache
        if: steps.cache-cli.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/release/macosdb
          key: macosdb-cli-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift-build-environment.outputs.digest }}-${{ hashFiles('Sources/**/*.swift', 'Package.swift', 'Package.resolved') }}

      - name: Download archive
        id: download-archive
        env:
          ADC_DOWNLOAD_AUTH: ${{ secrets.ADC_DOWNLOAD_AUTH }}
        run: |
          if [[ -L "${ARCHIVE_FILE}" || -L "${ARCHIVE_FILE}.part" || -L "${ARCHIVE_FILE}.sha256" ]]; then
            echo "::error::Refusing a symbolic link at the resolved archive path."
            exit 1
          fi
          if [[ -e "${ARCHIVE_FILE}" && ! -f "${ARCHIVE_FILE}" ]]; then
            echo "::error::Refusing a non-regular file at the resolved archive path."
            exit 1
          fi
          if [[ -e "${ARCHIVE_FILE}.sha256" && ! -f "${ARCHIVE_FILE}.sha256" ]]; then
            echo "::error::Refusing a non-regular file at the resolved archive checksum path."
            exit 1
          fi
          if [[ -f "${ARCHIVE_FILE}" ]]; then
            FORMAT_STATUS=0
            ARCHIVE_TYPE=$(/bin/bash scripts/check-xcode-archive-format.sh "${ARCHIVE_FORMAT}" "${ARCHIVE_FILE}") || FORMAT_STATUS=$?
            if (( FORMAT_STATUS == 0 )); then
              echo "downloaded=false" >> "${GITHUB_OUTPUT}"
              echo "Archive already cached at ${ARCHIVE_FILE}, skipping download"
              exit 0
            fi
            if (( FORMAT_STATUS == 1 )); then
              echo "::error::Cached file is not a valid .${ARCHIVE_FORMAT} archive (${ARCHIVE_TYPE}). Preserving it for investigation instead of replacing persistent cache state."
            else
              echo "::error::Could not check the format of the cached archive. Preserving it for investigation instead of replacing persistent cache state."
            fi
            exit 1
          fi

          if [[ -z "${ADC_DOWNLOAD_AUTH}" ]]; then
            echo "::error::ADC_DOWNLOAD_AUTH secret is not set. Set it with: gh secret set ADC_DOWNLOAD_AUTH --env apple-developer"
            exit 1
          fi

          HTTP_STATUS=$(curl -sSI -o /dev/null -w '%{http_code}' -H "Cookie: ADCDownloadAuth=${ADC_DOWNLOAD_AUTH}" "${CDN_URL}")
          CONTENT_TYPE=$(curl -sSI -H "Cookie: ADCDownloadAuth=${ADC_DOWNLOAD_AUTH}" "${CDN_URL}" | grep -i content-type | tail -1 | tr -d '\r')
          if [[ "${HTTP_STATUS}" != "200" ]] || [[ "${CONTENT_TYPE}" == *"text/html"* ]]; then
            echo "::error::Apple CDN returned HTTP ${HTTP_STATUS} (${CONTENT_TYPE}). The ADC_DOWNLOAD_AUTH cookie is likely expired — refresh it from developer.apple.com and update the secret."
            exit 1
          fi

          TOTAL=$(curl -sSI -H "Cookie: ADCDownloadAuth=${ADC_DOWNLOAD_AUTH}" "${CDN_URL}" | awk 'tolower($1) == "content-length:" { gsub("\r", "", $2); value=$2 } END { print value }')
          if [[ "${TOTAL}" =~ ^[0-9]+$ ]] && (( TOTAL > 0 )); then
            TOTAL_MB=$(( TOTAL / 1048576 ))
            TOTAL_GB=$(( TOTAL_MB * 10 / 1024 ))
            echo "Downloading archive ($(( TOTAL_GB / 10 )).$(( TOTAL_GB % 10 )) GB)..."
          else
            TOTAL=0
            TOTAL_MB=0
            echo "Downloading archive (server did not provide a content length)..."
          fi
          curl -sS --fail --proto '=https' --max-redirs 0 \
            --retry 10 --retry-delay 10 --retry-connrefused --retry-all-errors \
            -C - -H "Cookie: ADCDownloadAuth=${ADC_DOWNLOAD_AUTH}" \
            -o "${ARCHIVE_FILE}.part" "${CDN_URL}" &
          CURL_PID=$!
          while kill -0 "${CURL_PID}" 2>/dev/null; do
            if [[ -f "${ARCHIVE_FILE}.part" ]]; then
              SIZE=$(stat -f%z "${ARCHIVE_FILE}.part" 2>/dev/null || echo 0)
              SIZE_MB=$(( SIZE / 1048576 ))
              if (( TOTAL_MB > 0 )); then
                PCT=$(( SIZE_MB * 100 / TOTAL_MB ))
                echo "${PCT}% (${SIZE_MB} MB / ${TOTAL_MB} MB)"
              else
                echo "${SIZE_MB} MB downloaded"
              fi
            fi
            sleep 30
          done
          wait "${CURL_PID}"
          mv "${ARCHIVE_FILE}.part" "${ARCHIVE_FILE}"
          echo "downloaded=true" >> "${GITHUB_OUTPUT}"

      - name: Validate archive
        env:
          DOWNLOADED: ${{ steps.download-archive.outputs.downloaded }}
        run: |
          FILE_SIZE=$(stat -f%z "${ARCHIVE_FILE}")
          # Size comes first and the format is probed once, so a failing probe
          # can neither remove a usable download nor leave an undersized one cached.
          if (( FILE_SIZE < 104857600 )); then
            FORMAT_STATUS=1
            ARCHIVE_TYPE="under 100 MiB"
          else
            FORMAT_STATUS=0
            ARCHIVE_TYPE=$(/bin/bash scripts/check-xcode-archive-format.sh "${ARCHIVE_FORMAT}" "${ARCHIVE_FILE}") || FORMAT_STATUS=$?
          fi
          if (( FORMAT_STATUS > 1 )); then
            echo "::error::Could not check the format of ${ARCHIVE_FILE}. Preserving it, because a failed check says nothing about the archive."
            exit 1
          fi
          if (( FORMAT_STATUS == 1 )); then
            echo "::error::Archive file is not a valid .${ARCHIVE_FORMAT} archive (${ARCHIVE_TYPE}, $(( FILE_SIZE / 1024 )) KB). The ADC_DOWNLOAD_AUTH cookie may be expired — refresh it from developer.apple.com and update the secret."
            if [[ "${DOWNLOADED}" == "true" ]]; then
              rm -f "${ARCHIVE_FILE}"
            else
              echo "Preserving the invalid preexisting cache entry for investigation."
            fi
            exit 1
          fi
          echo "Archive validated: $(( FILE_SIZE / 1073741824 )) GB, ${ARCHIVE_TYPE}"

      - name: Set or verify archive modification time
        run: |
          if [[ "$(stat -f '%Sf' "${ARCHIVE_FILE}")" == *uchg* ]]; then
            ARCHIVE_DATE=$(stat -f '%Sm' -t '%Y-%m-%d' "${ARCHIVE_FILE}")
            if [[ "${ARCHIVE_DATE}" != "${RELEASE_DATE}" ]]; then
              echo "::error::Cached archive is immutable with modification date ${ARCHIVE_DATE}; expected ${RELEASE_DATE}. Re-dispatch with release_date=${ARCHIVE_DATE}, or unlock and correct the archive if that date is wrong."
              exit 1
            fi
            echo "Archive already immutable with release-date mtime ${ARCHIVE_DATE}, leaving unchanged"
          else
            TOUCH_DATE=$(echo "${RELEASE_DATE}" | tr -d '-')0000
            touch -t "${TOUCH_DATE}" "${ARCHIVE_FILE}"
          fi

      - name: Verify existing SHA-256 sidecar
        run: |
          if [[ -f "${ARCHIVE_FILE}.sha256" ]]; then
            .build/release/macosdb validate "${ARCHIVE_FILE}"
          fi

      - name: Scan Xcode archive
        env:
          IS_BETA: ${{ inputs.beta }}
          BETA_NUMBER: ${{ inputs.beta_number }}
          BETA_REVISION: ${{ inputs.beta_revision }}
          IS_RC: ${{ inputs.rc }}
          RC_NUMBER: ${{ inputs.rc_number }}
        run: |
          SCAN_ARGS=(
            "${ARCHIVE_FILE}"
            --output data/xcode/releases
            --release-date "${RELEASE_DATE}"
            --update-index
            --verbose
            "--${ARCHIVE_FORMAT}-url" "${PUBLIC_URL}"
          )
          if [[ "${IS_BETA}" == "true" ]]; then
            SCAN_ARGS+=(--beta)
          fi
          if [[ -n "${BETA_NUMBER}" ]]; then
            SCAN_ARGS+=(--beta-number "${BETA_NUMBER}")
          fi
          if [[ -n "${BETA_REVISION}" ]]; then
            SCAN_ARGS+=(--beta-revision "${BETA_REVISION}")
          fi
          if [[ "${IS_RC}" == "true" ]]; then
            SCAN_ARGS+=(--rc)
          fi
          if [[ -n "${RC_NUMBER}" ]]; then
            SCAN_ARGS+=(--rc-number "${RC_NUMBER}")
          fi
          .build/release/macosdb scan "${SCAN_ARGS[@]}"

      - name: Lint JSON
        run: ruby scripts/lint-json.rb

      - name: Package release JSON
        id: package-release
        run: |
          NEW_RELEASE_FILE=""
          MATCHES=0
          while IFS= read -r file; do
            [[ -n "${file}" ]] || continue
            NEW_RELEASE_FILE="${file}"
            MATCHES=$((MATCHES + 1))
          done < <(git ls-files --others --exclude-standard 'data/xcode/releases/')

          if (( MATCHES != 1 )); then
            echo "::error::Expected exactly one new Xcode release JSON file, found ${MATCHES}."
            exit 1
          fi
          EXPECTED_RELEASE_FILE="data/xcode/releases/${EXPECTED_VERSION%%.*}/Xcode-${EXPECTED_VERSION}-${EXPECTED_BUILD}.json"
          if [[ "${NEW_RELEASE_FILE}" != "${EXPECTED_RELEASE_FILE}" ]]; then
            echo "::error::Unexpected release JSON path: ${NEW_RELEASE_FILE}"
            exit 1
          fi
          if ! jq -e --arg version "${EXPECTED_VERSION}" --arg build "${EXPECTED_BUILD}" \
            '.osVersion == $version and .buildNumber == $build and .productType == "Xcode"' \
            "${NEW_RELEASE_FILE}" >/dev/null; then
            echo "::error::Scanned Xcode metadata does not match the dispatched version/build."
            exit 1
          fi

          /usr/bin/tar --no-mac-metadata --no-xattrs -czf "${RUNNER_TEMP}/release-json.tgz" data/xcode/releases.json "${NEW_RELEASE_FILE}"
          echo "basename=$(basename "${NEW_RELEASE_FILE}" .json)" >> "${GITHUB_OUTPUT}"

      - name: Create or verify SHA-256 sidecar
        run: .build/release/macosdb validate "${ARCHIVE_FILE}"

      - name: Lock archive files
        run: |
          if [[ "$(stat -f '%Sf' "${ARCHIVE_FILE}.sha256")" == *uchg* ]]; then
            echo "SHA-256 sidecar already immutable, preserving its mtime"
          else
            touch -r "${ARCHIVE_FILE}" "${ARCHIVE_FILE}.sha256"
          fi
          for f in "${ARCHIVE_FILE}" "${ARCHIVE_FILE}.sha256"; do
            [[ -f "$f" ]] && chflags uchg "$f"
          done

      - name: Upload release JSON artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-json
          path: ${{ runner.temp }}/release-json.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish
    needs: [prepare, scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: starhaven
      deployment: false
    outputs:
      pr_number: ${{ steps.open-pr.outputs.pr_number }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Ruby
        uses: $/.github/actions/setup-ruby

      - name: Download release JSON artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-json
          path: ${{ runner.temp }}/artifact

      - name: Verify and overlay release JSON
        id: verify-release
        env:
          ARTIFACT: ${{ runner.temp }}/artifact/release-json.tgz
          SOURCE_URL: ${{ inputs.archive_url }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          RELEASE_DATE: ${{ needs.prepare.outputs.release_date }}
          IS_BETA: ${{ inputs.beta }}
          BETA_NUMBER: ${{ inputs.beta_number }}
          BETA_REVISION: ${{ inputs.beta_revision }}
          IS_RC: ${{ inputs.rc }}
          RC_NUMBER: ${{ inputs.rc_number }}
        run: |
          ruby scripts/verify-release-artifact.rb \
            --artifact "${ARTIFACT}" \
            --product xcode \
            --source-url "${SOURCE_URL}" \
            --build-number "${BUILD_NUMBER}" \
            --release-date "${RELEASE_DATE}" \
            --beta "${IS_BETA}" \
            --beta-number "${BETA_NUMBER}" \
            --beta-revision "${BETA_REVISION}" \
            --rc "${IS_RC}" \
            --rc-number "${RC_NUMBER}" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Lint JSON
        run: ruby scripts/lint-json.rb

      - name: Mint bot token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.repository }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create signed commit and open PR
        id: open-pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_URL: ${{ steps.verify-release.outputs.source_url }}
          RELEASE_DATE: ${{ steps.verify-release.outputs.release_date }}
          BASENAME: ${{ steps.verify-release.outputs.basename }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          BASE_SHA=$(git rev-parse HEAD)
          BOT_USER="${APP_SLUG}[bot]"
          BOT_ID=$(gh api "/users/${BOT_USER}" --jq .id)

          BRANCH="feat/data-${BASENAME}"
          TITLE="feat(data): add ${BASENAME}"
          printf -v PR_BODY "## Summary\n- Scanned from: \`%s\`\n- Release date: %s\n\nAuto-generated by the [scan workflow](%s)." \
            "${SOURCE_URL}" "${RELEASE_DATE}" "${RUN_URL}"
          COMMIT_BODY="Signed-off-by: ${BOT_USER} <${BOT_ID}+${BOT_USER}@users.noreply.github.com>"

          if [[ -n "${TRIGGERING_ACTOR}" ]]; then
            if [[ ! "${TRIGGERING_ACTOR}" =~ ^[A-Za-z0-9][A-Za-z0-9-]{0,38}$ ]]; then
              echo "::error::Invalid triggering actor login."
              exit 1
            fi
            ACTOR_ID=$(gh api "/users/${TRIGGERING_ACTOR}" --jq .id)
            COAUTHOR="Co-authored-by: ${TRIGGERING_ACTOR} <${ACTOR_ID}+${TRIGGERING_ACTOR}@users.noreply.github.com>"
            COMMIT_BODY="${COMMIT_BODY}"$'\n'"${COAUTHOR}"
          fi

          # Stage untracked files as intent-to-add so git diff sees them.
          git add -N data/xcode/
          DIFF_FILES=$(git diff --name-only HEAD -- data/xcode/)
          if [[ -z "${DIFF_FILES}" ]]; then
            echo "::error::No Xcode data changes found after overlaying scan artifact."
            exit 1
          fi
          ADDITIONS_FILE="${RUNNER_TEMP}/additions.json"
          # shellcheck disable=SC2094 # Output is under RUNNER_TEMP, outside data/.
          printf '%s\n' "${DIFF_FILES}" |
            while IFS= read -r file; do
              # shellcheck disable=SC2016 # jq needs literal jq variable names.
              base64 < "$file" | tr -d '\n' |
                jq -Rs --arg path "$file" '{path: $path, contents: .}'
            done | jq -s . > "${ADDITIONS_FILE}"

          gh api "repos/${REPOSITORY}/git/refs" -X POST \
            -f "ref=refs/heads/${BRANCH}" \
            -f "sha=${BASE_SHA}"

          REQUEST_FILE="${RUNNER_TEMP}/create-commit.json"
          # shellcheck disable=SC2016 # jq needs literal GraphQL variable names.
          jq -n \
            --arg repo "${REPOSITORY}" \
            --arg branch "${BRANCH}" \
            --arg title "${TITLE}" \
            --arg body "${COMMIT_BODY}" \
            --arg head "${BASE_SHA}" \
            --slurpfile additions "${ADDITIONS_FILE}" \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid url } } }",
              variables: {
                input: {
                  branch: { repositoryNameWithOwner: $repo, branchName: $branch },
                  message: { headline: $title, body: $body },
                  fileChanges: { additions: $additions[0] },
                  expectedHeadOid: $head
                }
              }
            }' > "${REQUEST_FILE}"
          gh api graphql --input "${REQUEST_FILE}"

          PR_URL=$(gh pr create \
            --base main \
            --head "${BRANCH}" \
            --title "${TITLE}" \
            --body "${PR_BODY}")
          PR_NUMBER="${PR_URL##*/}"
          if [[ ! "${PR_NUMBER}" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not parse pull request number from gh output: ${PR_URL}"
            exit 1
          fi
          echo "pr_number=${PR_NUMBER}" >> "${GITHUB_OUTPUT}"

          gh pr merge "${BRANCH}" --squash --auto --delete-branch --body "${COMMIT_BODY}"

  wait-for-merge:
    name: Wait for merge
    needs: publish
    runs-on: ubuntu-slim
    timeout-minutes: 30
    permissions:
      pull-requests: read # required to poll auto-merge status without the app token
    steps:
      - name: Wait for PR to merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.publish.outputs.pr_number }}
        run: |
          if [[ ! "${PR_NUMBER}" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid pull request number: ${PR_NUMBER}"
            exit 1
          fi
          echo "Waiting for PR #${PR_NUMBER} to merge..."
          while true; do
            STATE=$(gh pr view "${PR_NUMBER}" --repo "${REPOSITORY}" --json state -q .state 2>/dev/null || true)
            case "${STATE}" in
              MERGED) echo "PR merged successfully"; exit 0 ;;
              CLOSED) echo "::error::PR was closed without merging"; exit 1 ;;
            esac
            sleep 30
          done
