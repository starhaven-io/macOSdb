name: CodeQL (site and scripts)

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "scripts/**"
      - ".github/workflows/codeql-interpreted.yml"

concurrency:
  group: "codeql-interpreted-${{ github.ref }}"
  cancel-in-progress: false

permissions: {}

jobs:
  analyze:
    name: Analyze
    permissions:
      contents: read
      security-events: write # required to upload SARIF results
    uses: starhaven-io/.github/.github/workflows/reusable-codeql.yml@e748ec16bd1207114a766d1d761a6743a6e3bf3a # v2026.09.09.4
    with:
      languages: '["javascript-typescript","python"]'
      runner: "ubuntu-slim"
