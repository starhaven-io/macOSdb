name: CodeQL (site and scripts)

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "scripts/**"
      - ".github/workflows/codeql-interpreted.yml"

concurrency:
  group: "codeql-interpreted-${{ github.ref }}"
  cancel-in-progress: false

permissions: {}

jobs:
  analyze:
    name: Analyze
    permissions:
      contents: read
      security-events: write # required to upload SARIF results
    uses: starhaven-io/.github/.github/workflows/reusable-codeql.yml@37929bf8f0faf72925aa510f12f9d3e4684d4d25 # v2026.10.08.2
    with:
      languages: '["javascript-typescript","python"]'
      runner: "ubuntu-slim"
