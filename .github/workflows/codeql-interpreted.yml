name: CodeQL (site and scripts)

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "scripts/**"
      - ".github/workflows/codeql-interpreted.yml"

concurrency:
  group: "codeql-interpreted-${{ github.ref }}"
  cancel-in-progress: false

permissions: {}

jobs:
  analyze:
    name: Analyze
    permissions:
      contents: read
      security-events: write # required to upload SARIF results
    uses: starhaven-io/.github/.github/workflows/reusable-codeql.yml@9783ddfb15b9c91b3f53a2a975067ed4937029ad # v2026.09.25.1
    with:
      languages: '["javascript-typescript","python"]'
      runner: "ubuntu-slim"
