name: CodeQL (site and scripts)

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "scripts/**"
      - ".github/workflows/codeql-interpreted.yml"

concurrency:
  group: "codeql-interpreted-${{ github.ref }}"
  cancel-in-progress: false

permissions: {}

jobs:
  analyze:
    name: Analyze
    permissions:
      contents: read
      security-events: write # required to upload SARIF results
    uses: starhaven-io/.github/.github/workflows/reusable-codeql.yml@60f6df5dd0ff8caa0605c069a0d1910e429667a2 # v2026.10.04.1
    with:
      languages: '["javascript-typescript","python"]'
      runner: "ubuntu-slim"
