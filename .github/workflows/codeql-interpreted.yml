name: CodeQL (site and scripts)

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "scripts/**"
      - "Gemfile"
      - "Gemfile.lock"
      - ".ruby-version"
      - ".github/workflows/codeql-interpreted.yml"

concurrency:
  group: "codeql-interpreted-${{ github.ref }}"
  cancel-in-progress: false

permissions: {}

jobs:
  analyze:
    name: Analyze
    permissions:
      contents: read
      security-events: write # required to upload SARIF results
    uses: starhaven-io/.github/.github/workflows/reusable-codeql.yml@46cdbd126a6458a81bbace7a08fa20a062b2fa26 # v2026.10.22.2
    with:
      languages: '["javascript-typescript","python","ruby"]'
      runner: "ubuntu-slim"
